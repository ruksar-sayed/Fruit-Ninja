<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Slice Ninja - three.js only</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js" crossorigin="anonymous"></script>
<style>
  * { -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #0a0e17; touch-action: none;
  }
  #three-canvas { position: absolute; top: 0; left: 0; display: block; touch-action: none; }
</style>
</head>
<body>
<!-- The entire game (world, HUD, menus, buttons, text, camera preview) is drawn into this one WebGL canvas by three.js. -->
<canvas id="three-canvas"></canvas>

<script>
(function () {
  const canvas = document.getElementById('three-canvas');
  const ROUND_SECONDS = 60;

  // Hidden video element: it is only the data source for MediaPipe and for a THREE.VideoTexture.
  // It is never displayed; three.js draws the preview.
  const inputVideo = document.createElement('video');
  inputVideo.setAttribute('playsinline', '');
  inputVideo.muted = true;
  inputVideo.style.display = 'none';
  document.body.appendChild(inputVideo);

  let W, H, DPR;

  // ================= three.js: game scene + HUD scene, one renderer =================
  let renderer = null, scene = null, camera = null, hudScene = null, hudCamera = null;
  const meshMap = new Map();
  let objIdCounter = 0;

  const CAM_DIST = 600;
  const CAM_FOV = 50;
  const REF_HEIGHT = 800;
  let visibleHeight = 0;
  let visibleWidthAtZ0 = 0;
  let WORLD_SCALE = 1;

  const raycaster = new THREE.Raycaster();
  const zPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

  function resize() {
    DPR = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    if (renderer) resizeThree();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  // ---------- tiny helpers ----------
  function basicMat(color, opacity) {
    return new THREE.MeshBasicMaterial({
      color: color, transparent: true, opacity: opacity == null ? 1 : opacity,
      depthTest: false, depthWrite: false, side: THREE.DoubleSide
    });
  }
  function mk(geo, mat, order) {
    const m = new THREE.Mesh(geo, mat);
    m.renderOrder = order || 0;
    m.frustumCulled = false;
    return m;
  }
  function roundedRectShape(w, h, r) {
    const x = -w / 2, y = -h / 2;
    const s = new THREE.Shape();
    s.moveTo(x + r, y);
    s.lineTo(x + w - r, y);
    s.quadraticCurveTo(x + w, y, x + w, y + r);
    s.lineTo(x + w, y + h - r);
    s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    s.lineTo(x + r, y + h);
    s.quadraticCurveTo(x, y + h, x, y + h - r);
    s.lineTo(x, y + r);
    s.quadraticCurveTo(x, y, x + r, y);
    return s;
  }
  function arcPoints(cx, cy, r, a0, a1, n) {
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const a = a0 + (a1 - a0) * (i / n);
      pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
    }
    return pts;
  }

  // ---------- stroke geometry (thick lines built from quads) ----------
  function pushStroke(pos, idx, pts, half, ox, oy) {
    for (let i = 0; i < pts.length - 1; i++) {
      const ax = pts[i][0] + ox, ay = pts[i][1] + oy;
      const bx = pts[i + 1][0] + ox, by = pts[i + 1][1] + oy;
      let dx = bx - ax, dy = by - ay;
      let len = Math.hypot(dx, dy);
      if (len < 1e-6) { dx = 1; dy = 0; len = 1; }
      const ux = dx / len, uy = dy / len;
      const ex = ux * half, ey = uy * half;
      const nx = -uy * half, ny = ux * half;
      const base = pos.length / 3;
      pos.push(
        ax - ex + nx, ay - ey + ny, 0,
        ax - ex - nx, ay - ey - ny, 0,
        bx + ex + nx, by + ey + ny, 0,
        bx + ex - nx, by + ey - ny, 0
      );
      idx.push(base, base + 1, base + 2, base + 1, base + 3, base + 2);
    }
  }
  function makeGeometry(pos, idx) {
    if (!pos.length) { pos.push(0, 0, 0, 0, 0, 0, 0, 0, 0); idx.push(0, 1, 2); }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setIndex(idx);
    return geo;
  }
  function strokeGeometry(polys, thickness) {
    const pos = [], idx = [];
    polys.forEach(p => pushStroke(pos, idx, p, thickness / 2, 0, 0));
    return makeGeometry(pos, idx);
  }

  // ================= text: a built-in vector stroke font, rendered as three.js meshes =================
  // Glyphs live on a 0..w by 0..6 grid (cap height 6). Uppercase, digits and a little punctuation.
  const G = (w, ...p) => ({ w: w, p: p });
  const O_POLY = [[1, 0], [0, 1], [0, 5], [1, 6], [3, 6], [4, 5], [4, 1], [3, 0], [1, 0]];
  const GLYPHS = {
    ' ': G(2.5),
    'A': G(4, [[0, 0], [2, 6], [4, 0]], [[0.8, 2.4], [3.2, 2.4]]),
    'B': G(4, [[0, 0], [0, 6], [2.8, 6], [3.8, 5.2], [3.8, 3.8], [2.8, 3], [0, 3]], [[2.8, 3], [4, 2.2], [4, 0.8], [3, 0], [0, 0]]),
    'C': G(4, [[4, 5], [3, 6], [1, 6], [0, 5], [0, 1], [1, 0], [3, 0], [4, 1]]),
    'D': G(4, [[0, 0], [0, 6], [2.5, 6], [4, 4.5], [4, 1.5], [2.5, 0], [0, 0]]),
    'E': G(4, [[4, 6], [0, 6], [0, 0], [4, 0]], [[0, 3], [3, 3]]),
    'F': G(4, [[4, 6], [0, 6], [0, 0]], [[0, 3], [3, 3]]),
    'G': G(4, [[4, 5], [3, 6], [1, 6], [0, 5], [0, 1], [1, 0], [3, 0], [4, 1], [4, 3], [2.2, 3]]),
    'H': G(4, [[0, 0], [0, 6]], [[4, 0], [4, 6]], [[0, 3], [4, 3]]),
    'I': G(2, [[0, 6], [2, 6]], [[1, 6], [1, 0]], [[0, 0], [2, 0]]),
    'J': G(4, [[4, 6], [4, 1], [3, 0], [1, 0], [0, 1]]),
    'K': G(4, [[0, 0], [0, 6]], [[4, 6], [0, 2.4]], [[1.3, 3.6], [4, 0]]),
    'L': G(4, [[0, 6], [0, 0], [4, 0]]),
    'M': G(5, [[0, 0], [0, 6], [2.5, 3.4], [5, 6], [5, 0]]),
    'N': G(4, [[0, 0], [0, 6], [4, 0], [4, 6]]),
    'O': G(4, O_POLY),
    'P': G(4, [[0, 0], [0, 6], [3, 6], [4, 5], [4, 4], [3, 3], [0, 3]]),
    'Q': G(4, O_POLY, [[2.6, 1.6], [4.2, -0.4]]),
    'R': G(4, [[0, 0], [0, 6], [3, 6], [4, 5], [4, 4], [3, 3], [0, 3]], [[2, 3], [4, 0]]),
    'S': G(4, [[4, 5], [3, 6], [1, 6], [0, 5], [0, 4], [1, 3], [3, 3], [4, 2], [4, 1], [3, 0], [1, 0], [0, 1]]),
    'T': G(4, [[0, 6], [4, 6]], [[2, 6], [2, 0]]),
    'U': G(4, [[0, 6], [0, 1], [1, 0], [3, 0], [4, 1], [4, 6]]),
    'V': G(4, [[0, 6], [2, 0], [4, 6]]),
    'W': G(5, [[0, 6], [1.2, 0], [2.5, 4], [3.8, 0], [5, 6]]),
    'X': G(4, [[0, 6], [4, 0]], [[4, 6], [0, 0]]),
    'Y': G(4, [[0, 6], [2, 3], [4, 6]], [[2, 3], [2, 0]]),
    'Z': G(4, [[0, 6], [4, 6], [0, 0], [4, 0]]),
    '0': G(4, O_POLY, [[0.9, 0.9], [3.1, 5.1]]),
    '1': G(3, [[0, 4.5], [1.5, 6], [1.5, 0]], [[0, 0], [3, 0]]),
    '2': G(4, [[0, 5], [1, 6], [3, 6], [4, 5], [4, 4], [0, 0], [4, 0]]),
    '3': G(4, [[0, 5], [1, 6], [3, 6], [4, 5], [4, 4], [3, 3], [1.5, 3]], [[3, 3], [4, 2], [4, 1], [3, 0], [1, 0], [0, 1]]),
    '4': G(4, [[3, 0], [3, 6], [0, 2], [4, 2]]),
    '5': G(4, [[4, 6], [0, 6], [0, 3.2], [3, 3.2], [4, 2.4], [4, 1], [3, 0], [1, 0], [0, 1]]),
    '6': G(4, [[3.5, 6], [1, 6], [0, 5], [0, 1], [1, 0], [3, 0], [4, 1], [4, 2], [3, 3], [0, 3]]),
    '7': G(4, [[0, 6], [4, 6], [1.5, 0]]),
    '8': G(4, [[1, 3], [0, 4], [0, 5], [1, 6], [3, 6], [4, 5], [4, 4], [3, 3], [1, 3], [0, 2], [0, 1], [1, 0], [3, 0], [4, 1], [4, 2], [3, 3]]),
    '9': G(4, [[4, 3], [1, 3], [0, 4], [0, 5], [1, 6], [3, 6], [4, 5], [4, 1], [3, 0], [0.5, 0]]),
    '+': G(4, [[0.5, 3], [3.5, 3]], [[2, 1.5], [2, 4.5]]),
    '-': G(4, [[0.5, 3], [3.5, 3]]),
    ':': G(1, [[0.5, 4], [0.5, 4.3]], [[0.5, 1.5], [0.5, 1.8]]),
    '.': G(1, [[0.5, 0], [0.5, 0.3]]),
    ',': G(1, [[0.5, 0.3], [0.1, -1.2]]),
    '!': G(1, [[0.5, 6], [0.5, 2]], [[0.5, 0], [0.5, 0.3]]),
    '?': G(4, [[0, 5], [1, 6], [3, 6], [4, 5], [4, 4], [2, 3], [2, 2]], [[2, 0], [2, 0.3]])
  };
  const GLYPH_H = 6;
  const SPACING = 2.2;
  const LINE_ADV = 10;
  function glyphOf(ch) { return GLYPHS[ch] || GLYPHS[' ']; }
  function lineWidth(s) {
    let w = 0;
    for (const ch of s) w += glyphOf(ch).w + SPACING;
    return Math.max(0, w - SPACING);
  }
  function wrapText(str, maxG) {
    const out = [];
    str.split('\n').forEach(par => {
      if (maxG == null) { out.push(par); return; }
      let cur = '';
      par.split(' ').forEach(word => {
        const trial = cur ? cur + ' ' + word : word;
        if (cur && lineWidth(trial) > maxG) { out.push(cur); cur = word; } else cur = trial;
      });
      out.push(cur);
    });
    return out;
  }
  function buildTextGeometry(lines, align, vAnchor, thickness) {
    const pos = [], idx = [];
    const half = thickness / 2;
    const n = lines.length;
    const totalH = GLYPH_H + (n - 1) * LINE_ADV;
    const widths = lines.map(lineWidth);
    const maxW = Math.max.apply(null, widths.concat([0]));
    const yShift = vAnchor === 'top' ? -GLYPH_H : -(GLYPH_H - (n - 1) * LINE_ADV) / 2;
    lines.forEach((line, li) => {
      let x = align === 'center' ? -widths[li] / 2 : align === 'right' ? -widths[li] : 0;
      const baseY = -li * LINE_ADV + yShift;
      for (const ch of line) {
        const g = glyphOf(ch);
        g.p.forEach(poly => pushStroke(pos, idx, poly, half, x, baseY));
        x += g.w + SPACING;
      }
    });
    return { geometry: makeGeometry(pos, idx), width: maxW, height: totalH };
  }

  // Each label gets its own stencil ref, so overlapping strokes inside one label
  // blend exactly once (no bright spots at joints, even while fading).
  let stencilCounter = 0;
  function nextStencilRef() {
    stencilCounter++;
    if (stencilCounter > 250) stencilCounter = 100; // HUD/menu labels use 1..99, popups recycle 100..250
    return stencilCounter;
  }

  class TextLabel {
    constructor(o) {
      this.align = o.align || 'left';
      this.vAnchor = o.vAnchor || 'middle';
      this.thickness = o.thickness || 1.1;
      this.key = null;
      this.wG = 0; this.hG = GLYPH_H;
      this.material = new THREE.MeshBasicMaterial({
        color: o.color, transparent: true, opacity: o.opacity == null ? 1 : o.opacity,
        depthTest: !!o.depthTest, depthWrite: false, side: THREE.DoubleSide,
        stencilWrite: true, stencilRef: nextStencilRef(),
        stencilFunc: THREE.NotEqualStencilFunc,
        stencilFail: THREE.ReplaceStencilOp, stencilZFail: THREE.ReplaceStencilOp, stencilZPass: THREE.ReplaceStencilOp
      });
      this.mesh = new THREE.Mesh(makeGeometry([], []), this.material);
      this.mesh.renderOrder = o.renderOrder || 0;
      this.mesh.frustumCulled = false;
      this.mesh.scale.setScalar((o.size || 12) / GLYPH_H);
    }
    get widthPx() { return this.wG * this.mesh.scale.x; }
    get heightPx() { return this.hG * this.mesh.scale.x; }
    set(str, maxWpx) {
      const s = String(str).toUpperCase();
      const key = s + '|' + (maxWpx == null ? '' : Math.round(maxWpx));
      if (key === this.key) return;
      this.key = key;
      const lines = wrapText(s, maxWpx == null ? null : maxWpx / this.mesh.scale.x);
      const built = buildTextGeometry(lines, this.align, this.vAnchor, this.thickness);
      this.mesh.geometry.dispose();
      this.mesh.geometry = built.geometry;
      this.wG = built.width;
      this.hG = built.height;
    }
    dispose() {
      this.mesh.geometry.dispose();
      this.material.dispose();
    }
  }

  // ---------- scene setup ----------
  function initThree() {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, stencil: true });
    renderer.setPixelRatio(DPR);
    renderer.setClearColor(0x0a0e17, 1);
    renderer.autoClear = false;
    renderer.localClippingEnabled = true;

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(CAM_FOV, W / H, 0.1, 3000);
    camera.position.set(0, 0, CAM_DIST);
    camera.lookAt(0, 0, 0);
    scene.add(camera); // camera-attached children (background, flash, watermark) need the camera in the scene

    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const key = new THREE.DirectionalLight(0xffffff, 0.95);
    key.position.set(-1, 1, 1.2);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0x88aaff, 0.4);
    rim.position.set(1, -0.6, -1);
    scene.add(rim);

    // HUD scene: orthographic camera measured in CSS pixels, origin at screen center
    hudScene = new THREE.Scene();
    hudCamera = new THREE.OrthographicCamera(-W / 2, W / 2, H / 2, -H / 2, 0.1, 200);
    hudCamera.position.set(0, 0, 100);

    initBackground();
    initWatermark();
    initFlash();
    initTrail();
    initHud();
    initOverlays();
    syncOverlays();
    resizeThree();
  }

  function resizeThree() {
    renderer.setPixelRatio(DPR);
    renderer.setSize(W, H);
    camera.aspect = W / H;
    camera.updateProjectionMatrix();
    const fovRad = (camera.fov * Math.PI) / 180;
    visibleHeight = 2 * Math.tan(fovRad / 2) * camera.position.z;
    visibleWidthAtZ0 = visibleHeight * camera.aspect;
    WORLD_SCALE = visibleHeight / REF_HEIGHT;
    updateBackgroundLayout();
    updateFlashPlaneSize();
    updateWatermarkLayout();

    hudCamera.left = -W / 2; hudCamera.right = W / 2;
    hudCamera.top = H / 2; hudCamera.bottom = -H / 2;
    hudCamera.updateProjectionMatrix();
    layoutHud();
    layoutMenu();
    layoutPause();
  }

  function screenToWorld(px, py) {
    const rect = canvas.getBoundingClientRect();
    const ndcX = (px / rect.width) * 2 - 1;
    const ndcY = -(py / rect.height) * 2 + 1;
    raycaster.setFromCamera({ x: ndcX, y: ndcY }, camera);
    const out = new THREE.Vector3();
    raycaster.ray.intersectPlane(zPlane, out);
    return { x: out.x, y: out.y };
  }
  function landmarkToWorld(tipX, tipY) {
    const ndcX = 1 - 2 * tipX;
    const ndcY = 1 - 2 * tipY;
    raycaster.setFromCamera({ x: ndcX, y: ndcY }, camera);
    const out = new THREE.Vector3();
    raycaster.ray.intersectPlane(zPlane, out);
    return { x: out.x, y: out.y };
  }

  // ---- background: radial gradient drawn by a shader on a plane far behind the action ----
  let bgMesh;
  const BG_DIST = 1200;
  function initBackground() {
    const mat = new THREE.ShaderMaterial({
      uniforms: { uAspect: { value: 1 } },
      vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
      fragmentShader: [
        'uniform float uAspect; varying vec2 vUv;',
        'void main(){',
        '  vec2 p = (vUv - vec2(0.5, 0.8)) * vec2(uAspect, 1.0);',
        '  float R = length(vec2(0.5 * uAspect, 0.8));',
        '  float t = clamp(length(p) / (0.7 * R), 0.0, 1.0);',
        '  vec3 c0 = vec3(0.102, 0.129, 0.220);',
        '  vec3 c1 = vec3(0.039, 0.055, 0.090);',
        '  gl_FragColor = vec4(mix(c0, c1, t), 1.0);',
        '}'
      ].join('\n')
    });
    bgMesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
    bgMesh.position.set(0, 0, -BG_DIST);
    bgMesh.renderOrder = -20;
    bgMesh.frustumCulled = false;
    camera.add(bgMesh);
  }
  function updateBackgroundLayout() {
    if (!bgMesh) return;
    const fovRad = (camera.fov * Math.PI) / 180;
    const h = 2 * BG_DIST * Math.tan(fovRad / 2) * 1.02;
    bgMesh.scale.set(h * camera.aspect, h, 1);
    bgMesh.material.uniforms.uAspect.value = camera.aspect;
  }

  // ---- fruit / bomb meshes ----
  function makeFruitMesh(o) {
    const r = o.r * 0.85;
    let mesh;
    const mainMat = new THREE.MeshStandardMaterial({ color: o.color, roughness: 0.45, metalness: 0.05 });
    if (o.type === 'banana') {
      mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 18, 14), mainMat);
      mesh.scale.set(1.5, 0.55, 0.7);
    } else if (o.type === 'grape') {
      mesh = new THREE.Group();
      [[-0.4, -0.2], [0.3, -0.3], [0, 0.1], [-0.15, 0.5], [0.35, 0.4]].forEach(p => {
        const m = new THREE.Mesh(new THREE.SphereGeometry(r * 0.45, 12, 10), mainMat.clone());
        m.position.set(p[0] * r, p[1] * r, (Math.random() - 0.5) * r * 0.3);
        mesh.add(m);
      });
    } else {
      mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 22, 18), mainMat);
    }
    if (o.type !== 'grape') {
      const leaf = new THREE.Mesh(new THREE.ConeGeometry(r * 0.28, r * 0.55, 8), new THREE.MeshStandardMaterial({ color: 0x3ddc84 }));
      leaf.position.set(r * 0.25, r * 1.05, 0);
      leaf.rotation.z = -0.6;
      mesh.add(leaf);
      const stem = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.06, r * 0.06, r * 0.35, 6), new THREE.MeshStandardMaterial({ color: 0x6b4423 }));
      stem.position.set(0, r * 1.1, 0);
      mesh.add(stem);
    }
    return mesh;
  }

  function makeBombMesh(o) {
    const r = o.r * 0.85;
    const group = new THREE.Group();
    const body = new THREE.Mesh(new THREE.SphereGeometry(r, 22, 18), new THREE.MeshStandardMaterial({ color: 0x1c1c1c, roughness: 0.3, metalness: 0.65 }));
    group.add(body);
    const fuse = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.08, r * 0.08, r * 0.6, 6), new THREE.MeshStandardMaterial({ color: 0xe8a33d }));
    fuse.position.set(r * 0.2, r * 1.15, 0);
    fuse.rotation.z = -0.5;
    group.add(fuse);
    const spark = new THREE.Mesh(new THREE.SphereGeometry(r * 0.15, 10, 8), new THREE.MeshStandardMaterial({ color: 0xffb020, emissive: 0xffb020, emissiveIntensity: 1.1 }));
    spark.position.set(r * 0.42, r * 1.55, 0);
    group.add(spark);
    return group;
  }

  function getOrCreateMesh(o) {
    if (o.__id === undefined) o.__id = objIdCounter++;
    let mesh = meshMap.get(o.__id);
    if (!mesh) {
      mesh = o.type === 'bomb' ? makeBombMesh(o) : makeFruitMesh(o);
      scene.add(mesh);
      meshMap.set(o.__id, mesh);
    }
    return mesh;
  }

  function disposeMesh(mesh) {
    mesh.traverse(c => {
      if (c.geometry) c.geometry.dispose();
      if (c.material) c.material.dispose();
    });
  }

  function removeMesh(o) {
    if (o.__id === undefined) return;
    const mesh = meshMap.get(o.__id);
    if (mesh) {
      scene.remove(mesh);
      disposeMesh(mesh);
      meshMap.delete(o.__id);
    }
  }

  function clearAllMeshes() {
    meshMap.forEach(mesh => { scene.remove(mesh); disposeMesh(mesh); });
    meshMap.clear();
  }

  function updatePieceClip(o, mesh) {
    const A = o.rot + o.cutAngle;
    const sign = -o.side;
    const normal = new THREE.Vector3(sign * Math.cos(A), sign * Math.sin(A), 0);
    const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(normal, new THREE.Vector3(o.x, o.y, 0));
    mesh.traverse(c => { if (c.material) c.material.clippingPlanes = [plane]; });
  }

  // ---- slice trail ----
  let trailGlowMesh, trailCoreMesh;
  function initTrail() {
    const glowMat = new THREE.MeshBasicMaterial({ color: 0x00fff5, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false, side: THREE.DoubleSide });
    const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95, depthTest: false, depthWrite: false, side: THREE.DoubleSide });
    trailGlowMesh = new THREE.Mesh(new THREE.BufferGeometry(), glowMat);
    trailCoreMesh = new THREE.Mesh(new THREE.BufferGeometry(), coreMat);

  // Chaikin corner cutting: turns the jagged polyline of trail samples into a smooth curve
  function chaikin(points, iters) {
    let pts = points;
    for (let k = 0; k < iters; k++) {
      if (pts.length < 3) break;
      const out = [pts[0]];
      for (let i = 0; i < pts.length - 1; i++) {
        const a = pts[i], b = pts[i + 1];
        out.push({ x: 0.75 * a.x + 0.25 * b.x, y: 0.75 * a.y + 0.25 * b.y });
        out.push({ x: 0.25 * a.x + 0.75 * b.x, y: 0.25 * a.y + 0.75 * b.y });
      }
      out.push(pts[pts.length - 1]);
      pts = out;
    }
    return pts;
  }

  // tail (index 0) is thin, head (last index) is full width
  function buildRibbonGeometry(points, width) {
    const n = points.length;
    const positions = [];
    for (let i = 0; i < n; i++) {
      let dx, dy;
      if (i === 0) { dx = points[1].x - points[0].x; dy = points[1].y - points[0].y; }
      else if (i === n - 1) { dx = points[i].x - points[i - 1].x; dy = points[i].y - points[i - 1].y; }
      else { dx = points[i + 1].x - points[i - 1].x; dy = points[i + 1].y - points[i - 1].y; }
      const len = Math.hypot(dx, dy) || 1;
      const px = -dy / len, py = dx / len;
      const hw = (width / 2) * (0.12 + 0.88 * (i / (n - 1)));
      positions.push(points[i].x + px * hw, points[i].y + py * hw, 0.06);
      positions.push(points[i].x - px * hw, points[i].y - py * hw, 0.06);
    }
    const indices = [];
    for (let i = 0; i < n - 1; i++) {
      const a = i * 2, b = i * 2 + 1, c = (i + 1) * 2, d = (i + 1) * 2 + 1;
      indices.push(a, b, c, b, d, c);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setIndex(indices);
    return geo;
  }

  function updateTrailMesh(now) {
    if (trail.length < 2) { hideTrail(); return; }
    // drop near-duplicate samples (they would make zero-length ribbon segments), then smooth
    const clean = [trail[0]];
    for (let i = 1; i < trail.length; i++) {
      const q = clean[clean.length - 1];
      if (Math.hypot(trail[i].x - q.x, trail[i].y - q.y) > 0.01 * WORLD_SCALE) clean.push(trail[i]);
    }
    if (clean.length < 2) { hideTrail(); return; }
    const pts = chaikin(clean, 3);
    const hue = (now / 8) % 360;
    trailGlowMesh.material.color.setHSL(hue / 360, 1, 0.6);
    const glowW = 11 * WORLD_SCALE, coreW = 3.5 * WORLD_SCALE;
    trailGlowMesh.geometry.dispose();
    trailGlowMesh.geometry = buildRibbonGeometry(pts, glowW);
    trailCoreMesh.geometry.dispose();
    trailCoreMesh.geometry = buildRibbonGeometry(pts, coreW);
    trailGlowMesh.visible = true;
    trailCoreMesh.visible = true;
  }

  // ---- shared particle textures: generated numerically as DataTextures (no 2D canvas) ----
  function makeDataTexture(size, pixelFn) {
    const data = new Uint8Array(size * size * 4);
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const d = Math.hypot(x + 0.5 - size / 2, y + 0.5 - size / 2) / (size / 2);
        const px = pixelFn(Math.min(1, d));
        const i = (y * size + x) * 4;
        data[i] = px[0]; data[i + 1] = px[1]; data[i + 2] = px[2]; data[i + 3] = Math.round(px[3] * 255);
      }
    }
    const tex = new THREE.DataTexture(data, size, size, THREE.RGBAFormat);
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.needsUpdate = true;
    return tex;
  }
  function makeRadialTexture(innerAlpha, size) {
    return makeDataTexture(size, d => [255, 255, 255, innerAlpha * (1 - d)]);
  }
  function makeSplashTexture(size) {
    return makeDataTexture(size, d => {
      if (d < 0.55) {
        const u = d / 0.55;
        return [180 + (90 - 180) * u, 20 + (10 - 20) * u, 20 + (10 - 20) * u, 0.9 + (0.55 - 0.9) * u];
      }
      const u = (d - 0.55) / 0.45;
      return [90 + (10 - 90) * u, 10, 10 + (10 - 10) * u, 0.55 * (1 - u)];
    });
  }
  const dotTexture = makeRadialTexture(1, 64);
  const glowTexture = makeRadialTexture(0.9, 128);
  const splashTexture = makeSplashTexture(128);

  // ---- stacked, auto-fitting overlay layout ----
  function stack(group, items) {
    let y = 0;
    items.forEach((it, i) => {
      it.obj.position.y = y - (it.centered ? it.h / 2 : 0);
      y -= it.h + (i < items.length - 1 ? it.gap : 0);
    });
    const total = Math.max(1, -y);
    const s = Math.min(1, (H - 24) / total);
    group.scale.set(s, s, 1);
    group.position.set(0, (s * total) / 2, 0);
  }

  function hitButton(hx, hy) {
    hudScene.updateMatrixWorld(true);
    for (let i = buttons.length - 1; i >= 0; i--) {
      const b = buttons[i];
      if (!isChainVisible(b.group)) continue;
      _hv.set(hx, hy, 0);
      b.group.worldToLocal(_hv);
      const inside = b.hit.type === 'circle'
        ? Math.hypot(_hv.x, _hv.y) <= b.hit.r
        : (Math.abs(_hv.x) <= b.hit.hw && Math.abs(_hv.y) <= b.hit.hh);
      if (inside) return b;
    }
    return null;
  }
  function setBtnPressed(b, p) { b.group.scale.set(p ? 0.94 : 1, p ? 0.94 : 1, 1); }

  // ================= game state =================
  const GOOD_OBJECTS = [
    { type: 'apple', color: '#e6423f', r: 30 },
    { type: 'orange', color: '#f2932b', r: 30 },

    { type: 'watermelon', color: '#3ddc84', r: 36 },

  const NEON_COLORS = [0x00fff5, 0xff00e5, 0x39ff14, 0xfffb00, 0xff8a00, 0x00b3ff];
  function pickNeonColor() { return NEON_COLORS[Math.floor(Math.random() * NEON_COLORS.length)]; }
  function pickRandom(arr, n) {
    const picks = [];

  // ---- audio (Web Audio API, no files needed) ----
  let audioCtx = null;
  let musicTimer = null;
  let musicStep = 0;

  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function tone(freq, dur, type, vol, delay) {
    if (muted || !audioCtx) return;
    const t0 = audioCtx.currentTime + (delay || 0);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }
  function noiseBurst(dur, vol, delay) {
    if (muted || !audioCtx) return;
    const t0 = audioCtx.currentTime + (delay || 0);
    const bufferSize = audioCtx.sampleRate * dur;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(700, t0);
    src.connect(filter).connect(gain).connect(audioCtx.destination);
    src.start(t0);
  }
  function playSwish() { tone(900, 0.12, 'triangle', 0.05); tone(500, 0.1, 'triangle', 0.04, 0.02); }
  function playGoodHit() { tone(880, 0.18, 'sine', 0.09); tone(1320, 0.22, 'sine', 0.06, 0.05); }
  function playBombHit() {
    tone(90, 0.5, 'square', 0.12);
    tone(55, 0.7, 'sawtooth', 0.08, 0.05);
    noiseBurst(0.5, 0.18, 0);
  }
  const SCALE = [261.6, 293.7, 329.6, 392.0, 440.0, 523.3, 587.3];
  function musicStepFn() {
    if (!running || muted || awaitingCamera) return;
    const note = SCALE[Math.floor(Math.random() * SCALE.length)];
    tone(note, 0.5, 'triangle', 0.035);
    if (musicStep % 4 === 0) tone(note / 2, 0.6, 'sine', 0.025);
    musicStep++;
  }
  function startMusic() {
    ensureAudio();
    if (musicTimer) clearInterval(musicTimer);
    musicStep = 0;
    musicTimer = setInterval(musicStepFn, 420);

  function stopMusic() {

  let objects = [];
  let particles = [];
  let score = 0;
  let running = false;
  let waveTimer = 0;
  let timeRemaining = ROUND_SECONDS * 1000;
  let lastSecsShown = ROUND_SECONDS;
  const WAVE_INTERVAL = 5000;

  function setScore(v) {

  function spawnWave() {
    const good = pickRandom(GOOD_OBJECTS, 5);
    const bad = pickRandom(BAD_OBJECTS, 3);

    batch.forEach((o, i) => {

  function launchObject(o) {
    const margin = 60 * WORLD_SCALE;
    const x = -visibleWidthAtZ0 / 2 + margin + Math.random() * (visibleWidthAtZ0 - margin * 2);
    const vy = visibleHeight * 0.014 + Math.random() * 2.4 * WORLD_SCALE;
    const vx = (Math.random() - 0.5) * 2.4 * WORLD_SCALE;

    objects.push({
      type: o.type, color: o.color, r, good: o.good,

  // popups are stroke-font text meshes in the game scene
  function popup(x, y, text, color) {

    label.set(text);

  function disposeParticle(p) {

  function addGlow(x, y, color) {
    const mat = new THREE.SpriteMaterial({ map: glowTexture, color, transparent: true, opacity: 1, blending: THREE.AdditiveBlending, depthTest: false });
    const spr = new THREE.Sprite(mat);

    for (let i = 0; i < 8; i++) {

      const sspr = new THREE.Sprite(smat);

      sspr.position.set(x, y, 0.05);

  function addBombSplash(x, y) {

      const ang = Math.random() * Math.PI * 2;
      const speed = (1 + Math.random() * 3.5) * WORLD_SCALE;

      const cspr = new THREE.Sprite(cmat);

      cspr.position.set(x, y, 0.04);
      scene.add(cspr);
      particles.push({ sprite: cspr, x, y, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed - 0.5 * WORLD_SCALE, life: 1, decay: 0.02, kind: 'chunk' });

  let timeScale = 1;
  let flashAlpha = 0;
  function triggerSlowMotion() { flashAlpha = 0.55; }

  // ---- slicing: pure world-space collision ----
  let trail = [];
  let pointerDown = false;

  function segCircleHit(p1, p2, cx, cy, r) {
    const dx = p2.x - p1.x, dy = p2.y - p1.y;
    const len2 = dx * dx + dy * dy;
    if (len2 === 0) {
      const ddx = p1.x - cx, ddy = p1.y - cy;
      return Math.sqrt(ddx * ddx + ddy * ddy) <= r;
    }
    let t = ((cx - p1.x) * dx + (cy - p1.y) * dy) / len2;
    t = Math.max(0, Math.min(1, t));
    const px = p1.x + t * dx, py = p1.y + t * dy;
    const ddx = px - cx, ddy = py - cy;
    return Math.sqrt(ddx * ddx + ddy * ddy) <= r;
  }

  function checkSlices(p1, p2) {
    if (!p1 || !p2) return;
    for (const o of objects) {
      if (!o.alive || o.sliced || o.isPiece) continue;
      if (segCircleHit(p1, p2, o.x, o.y, o.r * 1.15)) sliceObject(o, p1, p2);
    }
  }

  function sliceObject(o, p1, p2) {
    o.sliced = true;
    o.alive = false;
    if (o.good) {
      score += 10;
      popup(o.x, o.y, '+10', '#3ddc84');
      addGlow(o.x, o.y, pickNeonColor());
      playGoodHit();
    } else {
      score -= 2;
      popup(o.x, o.y, '-2', '#ff3b4e');
      addBombSplash(o.x, o.y);
      triggerSlowMotion();
      playBombHit();
    }
    playSwish();
    setScore(score);
    spawnPieces(o, p1, p2);
  }

  function spawnPieces(o, p1, p2) {
    const dx = p2.x - p1.x, dy = p2.y - p1.y;
    const theta = (dx === 0 && dy === 0) ? 0 : Math.atan2(dy, dx);
    const localCut = theta - o.rot;
    const perp = theta + Math.PI / 2;
    const speed = (2.5 + Math.random() * 2) * WORLD_SCALE;

    [1, -1].forEach(sign => {
      objects.push({
        type: o.type, color: o.color, r: o.r, good: o.good,
        isPiece: true, side: sign, cutAngle: localCut,
        x: o.x, y: o.y,
        vx: o.vx + Math.cos(perp) * speed * sign,
        vy: o.vy + Math.sin(perp) * speed * sign + 1.5 * WORLD_SCALE,
        gravity: o.gravity,
        rot: o.rot,
        vrot: o.vrot + sign * 0.12,
        sliced: true,
        alive: true
      });
    });
  }

  // ---- pointer input: HUD buttons (any pointer) + touch slicing ----
  let activePointerId = null;
  let pressedBtn = null, pressedPointer = null;
  function hudPoint(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left - W / 2, y: H / 2 - (e.clientY - rect.top) };
  }
  function onDown(e) {
    const hp = hudPoint(e);
    const b = hitButton(hp.x, hp.y);
    if (b) {
      pressedBtn = b; pressedPointer = e.pointerId;
      setBtnPressed(b, true);
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
      return;
    }
    if (!running) return;
    if (e.pointerType === 'mouse') return;
    if (activePointerId !== null) return;
    activePointerId = e.pointerId;
    pointerDown = true;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    const rect = canvas.getBoundingClientRect();
    const p = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
    trail = [p];
    checkSlices(p, p);
    e.preventDefault();
  }
  function onMove(e) {
    if (e.pointerType === 'mouse' && !pressedBtn) {
      const hp = hudPoint(e);
      canvas.style.cursor = hitButton(hp.x, hp.y) ? 'pointer' : 'default';
    }
    if (!running || !pointerDown || e.pointerId !== activePointerId) return;
    const rect = canvas.getBoundingClientRect();
    const points = (e.getCoalescedEvents && e.getCoalescedEvents()) || [e];
    points.forEach(ev => {
      const p = screenToWorld(ev.clientX - rect.left, ev.clientY - rect.top);
      const prev = trail[trail.length - 1];
      trail.push(p);
      if (trail.length > 18) trail.shift();
      checkSlices(prev, p);
    });
    e.preventDefault();
  }
  function onUp(e) {
    if (pressedBtn && e.pointerId === pressedPointer) {
      const b = pressedBtn;
      pressedBtn = null; pressedPointer = null;
      setBtnPressed(b, false);
      if (e.type === 'pointerup') {
        const hp = hudPoint(e);
        if (hitButton(hp.x, hp.y) === b) b.onClick();
      }
      return;
    }
    if (e.pointerId !== activePointerId) return;
    activePointerId = null;
    pointerDown = false;
    trail = [];
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('pointerleave', onUp);

  // ---- hand tracking ----
  const FINGER_JOINTS = {
    index: { tip: 8, pip: 6 }, middle: { tip: 12, pip: 10 },
    ring: { tip: 16, pip: 14 }, pinky: { tip: 20, pip: 18 }
  };
  function isFingerExtended(lm, joints) { return lm[joints.tip].y < lm[joints.pip].y - 0.02; }
  function isIndexOnlyPose(lm) {
    return isFingerExtended(lm, FINGER_JOINTS.index) &&
      !isFingerExtended(lm, FINGER_JOINTS.middle) &&
      !isFingerExtended(lm, FINGER_JOINTS.ring) &&
      !isFingerExtended(lm, FINGER_JOINTS.pinky);
  }

  let hands = null;
  let cameraHelper = null;
  let handDown = false;
  let smoothPt = null;

  class OneEuroFilter {
    constructor(minCutoff, beta, dCutoff) { this.minCutoff = minCutoff; this.beta = beta; this.dCutoff = dCutoff; this.reset(); }
    reset() { this.xPrev = null; this.dxPrev = 0; this.tPrev = null; }
    alpha(cutoff, dt) { const tau = 1 / (2 * Math.PI * cutoff); return 1 / (1 + tau / dt); }
    filter(x, t) {
      if (this.tPrev === null) { this.tPrev = t; this.xPrev = x; return x; }
      const dt = Math.max((t - this.tPrev) / 1000, 1 / 120);
      this.tPrev = t;
      const dx = (x - this.xPrev) / dt;
      const aD = this.alpha(this.dCutoff, dt);
      const edx = this.dxPrev + aD * (dx - this.dxPrev);
      this.dxPrev = edx;
      const cutoff = this.minCutoff + this.beta * Math.abs(edx);
      const a = this.alpha(cutoff, dt);
      const filtered = this.xPrev + a * (x - this.xPrev);
      this.xPrev = filtered;
      return filtered;
    }
  }
  // HAND_SMOOTHING: 0 = raw tracking, 1 = very smooth (more lag). 0.9 is very smooth; drop toward 0.75 if it feels laggy.
  // The One Euro filter smooths hard when the finger is slow (kills jitter) and relaxes
  // when it moves fast (so quick swipes still feel responsive).
  const HAND_SMOOTHING = 0.9;
  const RENDER_FOLLOW = 1 - 0.7 * HAND_SMOOTHING; // per-frame follow factor for the on-screen cursor
  const tipFilterX = new OneEuroFilter(6 * Math.pow(0.05, HAND_SMOOTHING), 10, 1.0);
  const tipFilterY = new OneEuroFilter(6 * Math.pow(0.05, HAND_SMOOTHING), 10, 1.0);

  // A 1-3 frame flicker in pose detection or tracking shouldn't break the slice, so ride through it.
  const POSE_GRACE_FRAMES = 3;
  let poseMiss = 0, lostFrames = 0;
  let handSlicing = false, handPresent = false;
  let lastRawPoint = null, lastRawTime = 0;
  let handVX = 0, handVY = 0;
  const MAX_EXTRAPOLATE_MS = 120;

  function onHandResults(results) {
    const lm = results.multiHandLandmarks && results.multiHandLandmarks[0];
    let slicingPose = false;

    if (lm) {
      const rawPose = isIndexOnlyPose(lm);
      poseMiss = rawPose ? 0 : poseMiss + 1;
      lostFrames = 0;
      slicingPose = rawPose || (handSlicing && poseMiss <= POSE_GRACE_FRAMES);
      const rawTip = lm[8];
      const nowMs = performance.now();
      const smoothedTip = { x: tipFilterX.filter(rawTip.x, nowMs), y: tipFilterY.filter(rawTip.y, nowMs) };
      if (previewDot) {
        previewDot.visible = true;
        previewDot.material.color.set(slicingPose ? 0x3ddc84 : 0xff3b4e);
        previewDot.position.set((smoothedTip.x - 0.5) * 110, -(smoothedTip.y - 0.5) * 80, 0.1);
      }

      handPresent = true;
      const rawP = landmarkToWorld(smoothedTip.x, smoothedTip.y); // filtered, not raw
      if (slicingPose && lastRawPoint && handSlicing) {
        const dt = Math.max(nowMs - lastRawTime, 1);
        handVX += ((rawP.x - lastRawPoint.x) / dt - handVX) * 0.5;
        handVY += ((rawP.y - lastRawPoint.y) / dt - handVY) * 0.5;
      } else {
        handVX = 0; handVY = 0;
      }
      lastRawPoint = rawP;
      lastRawTime = nowMs;
      handSlicing = slicingPose;
    } else if (handSlicing && ++lostFrames <= POSE_GRACE_FRAMES) {
      // brief tracking dropout: keep coasting on the last motion instead of cutting the trail
    } else {
      if (previewDot) previewDot.visible = false;
      tipFilterX.reset(); tipFilterY.reset();
      handPresent = false; handSlicing = false; lastRawPoint = null;
      handVX = 0; handVY = 0;
      poseMiss = 0; lostFrames = 0;
    }

    if (running && awaitingCamera) { awaitingCamera = false; hideHandStatus(); lastTime = performance.now(); }
    if (!running) return;
    if (!handPresent) { showHandStatus('SHOW YOUR HAND TO THE CAMERA'); return; }
    if (handSlicing) hideHandStatus();
    else showHandStatus('FOLD THE OTHER FINGERS - POINT WITH YOUR INDEX FINGER TO SLICE');
  }

  // While the camera + model come up, the round is held (no timer, no waves) behind a visible message.
  let awaitingCamera = false, awaitStart = 0;
  const CAMERA_TIMEOUT_MS = 12000;
  let handsInit = null;

  function ensureHands() {
    if (hands || typeof Hands === 'undefined') return;
    hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
    hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    hands.onResults(onHandResults);
  }
  // Load the tracker's WASM + model while the player is still on the menu, so Start doesn't stall.
  function warmUpHands() {
    try {
      ensureHands();
      if (hands && !handsInit && hands.initialize) handsInit = Promise.resolve(hands.initialize()).catch(() => {});
    } catch (err) { console.warn('hand tracker warm-up failed', err); }
  }
  function beginCameraStart() {
    awaitingCamera = true;
    awaitStart = performance.now();
    showHandStatus('STARTING CAMERA...');
    // let the game screen paint first; the heavy camera/model setup runs after it
    setTimeout(() => { if (running) initHandTracking(); }, 30);
  }

  function initHandTracking() {
    if (typeof Hands === 'undefined' || typeof Camera === 'undefined') {
      awaitingCamera = false;
      showHandStatus('HAND TRACKING UNAVAILABLE - USE TOUCH INSTEAD');
      return;
    }
    ensureHands();
    if (!cameraHelper) {
      cameraHelper = new Camera(inputVideo, { onFrame: async () => { await hands.send({ image: inputVideo }); }, width: 480, height: 360 });
    }
    previewOn = true;
    syncOverlays();
    cameraHelper.start().catch(() => {
      awaitingCamera = false;
      previewOn = false;
      syncOverlays();
      showHandStatus('CAMERA UNAVAILABLE - USE TOUCH INSTEAD');
    });
  }

  function stopCamera() {
    awaitingCamera = false;
    if (cameraHelper) { try { cameraHelper.stop(); } catch (err) {} }
    if (inputVideo.srcObject) {
      inputVideo.srcObject.getTracks().forEach(t => t.stop());
      inputVideo.srcObject = null;
    }
    previewOn = false;
    if (previewDot) previewDot.visible = false;
    hideHandStatus();
  }

  function resetHandState() {
    handDown = false;
    smoothPt = null;
    handSlicing = false; handPresent = false; lastRawPoint = null; handVX = 0; handVY = 0;
    poseMiss = 0; lostFrames = 0;
    tipFilterX.reset();
    tipFilterY.reset();
    trail = [];
    hideTrail();
  }

  // ---- per-frame game update: split into stages so one failing stage can't freeze the rest ----
  const DEBUG = /[?&]debug\b/.test((window.location && window.location.search) || '');
  let lastErr = '';
  function safe(stage, fn) {
    try { return fn(); }
    catch (err) {
      console.error('[slice-ninja:' + stage + ']', err);
      lastErr = stage + ': ' + (err && err.message ? err.message : String(err));
    }
  }

  let lastTime = performance.now();

  function stepHand(now) {
    // hand-tracking slice check, extrapolated to render-frame rate
    if (handSlicing && lastRawPoint) {
      const elapsed = Math.max(0, Math.min(now - lastRawTime, MAX_EXTRAPOLATE_MS));
      let ep = { x: lastRawPoint.x + handVX * elapsed, y: lastRawPoint.y + handVY * elapsed };
      ep.x = Math.max(-visibleWidthAtZ0 / 2, Math.min(visibleWidthAtZ0 / 2, ep.x));
      ep.y = Math.max(-visibleHeight / 2, Math.min(visibleHeight / 2, ep.y));
      // ease the on-screen cursor toward the extrapolated point so 30fps camera updates don't step
      if (!handDown || !smoothPt) smoothPt = { x: ep.x, y: ep.y };
      else { smoothPt.x += (ep.x - smoothPt.x) * RENDER_FOLLOW; smoothPt.y += (ep.y - smoothPt.y) * RENDER_FOLLOW; }
      ep = { x: smoothPt.x, y: smoothPt.y };
      if (!handDown) { trail = [ep]; checkSlices(ep, ep); }
      else {
        const prev = trail[trail.length - 1] || ep;
        trail.push(ep);
        if (trail.length > 18) trail.shift();
        checkSlices(prev, ep);
      }
      handDown = true;
    } else if (handDown) {
      handDown = false;
      smoothPt = null;
      trail = [];
    }
  }

  // returns false when the round just ended
  function stepClock(dt) {
    timeScale += (1 - timeScale) * 0.05;
    if (Math.abs(1 - timeScale) < 0.01) timeScale = 1;

    waveTimer += dt * timeScale;
    if (waveTimer >= WAVE_INTERVAL) { waveTimer = 0; spawnWave(); }
    hud.waveFill.scale.x = Math.max(0.0001, 1 - waveTimer / WAVE_INTERVAL);

    timeRemaining -= dt * timeScale;
    if (timeRemaining <= 0) {
      timeRemaining = 0;
      hud.timeValue.set('0');
      finishGame();
      return false;
    }
    const secs = Math.ceil(timeRemaining / 1000);
    if (secs !== lastSecsShown) { lastSecsShown = secs; hud.timeValue.set(String(secs)); }
    return true;
  }

  function stepObjects() {
    objects.forEach(o => {
      if (!o.alive) { removeMesh(o); return; }
      o.x += o.vx * timeScale;
      o.y += o.vy * timeScale;
      o.vy -= o.gravity * timeScale;
      o.rot += o.vrot * timeScale;
      if (o.y + o.r < -visibleHeight / 2 - 40 * WORLD_SCALE) { o.alive = false; removeMesh(o); return; }

      const mesh = getOrCreateMesh(o);
      mesh.position.set(o.x, o.y, 0);
      mesh.rotation.z = o.rot;
      if (o.isPiece) updatePieceClip(o, mesh);
    });
    objects = objects.filter(o => o.alive);
  }

  function stepParticles() {
    particles.forEach(p => {
      p.x += (p.vx || 0) * timeScale;
      p.y += (p.vy || 0) * timeScale;
      if (p.kind === 'spark' || p.kind === 'chunk') p.vy -= 0.08 * timeScale * WORLD_SCALE;
      p.life -= p.decay;
      p.sprite.position.set(p.x, p.y, p.sprite.position.z);
      if (p.grow) {
        const scale = p.baseScale + (1 - p.life) * p.growAmount;
        p.sprite.scale.set(scale, scale, 1);
      }
      p.sprite.material.opacity = Math.max(0, p.life);
    });
    particles = particles.filter(p => {
      if (p.life <= 0) { disposeParticle(p); return false; }
      return true;
    });
  }

  function stepEffects(now) {
    flashMesh.material.opacity = flashAlpha;
    if (flashAlpha > 0.002) flashAlpha *= 0.9; else flashAlpha = 0;
    updateTrailMesh(now);
  }

  function update(now, dt) {
    if (awaitingCamera) {
      if (performance.now() - awaitStart > CAMERA_TIMEOUT_MS) {
        awaitingCamera = false;
        showHandStatus('CAMERA NOT READY - USE TOUCH INSTEAD');
      }
      return;
    }
    safe('hand', () => stepHand(now));
    if (safe('clock', () => stepClock(dt)) === false) return;
    safe('objects', stepObjects);
    safe('particles', stepParticles);
    safe('effects', () => stepEffects(now));
  }

  // ---- main loop: always running so the three.js menus stay live ----
  let fpsFrames = 0, fpsStart = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(now - lastTime, 100);
    lastTime = now;
    if (running) update(now, dt);

    safe('render', () => {
      renderer.clear();
      renderer.render(scene, camera);
      renderer.clearDepth();
      renderer.render(hudScene, hudCamera);
    });

    if (DEBUG && hud.debug) {
      fpsFrames++;
      if (now - fpsStart >= 500) {
        const fps = Math.round((fpsFrames * 1000) / (now - fpsStart));
        fpsFrames = 0; fpsStart = now;
        hud.debug.set('FPS ' + fps + (lastErr ? '  ' + lastErr.slice(0, 80) : ''), W - 40);
      }
    }
  }

  // ---- game flow ----
  function startGame() {
    ensureAudio();
    paused = false;
    score = 0;
    setScore(0);
    clearAllMeshes();
    particles.forEach(disposeParticle);
    objects = [];
    particles = [];
    resetHandState();
    timeScale = 1;
    flashAlpha = 0;
    waveTimer = WAVE_INTERVAL;
    timeRemaining = ROUND_SECONDS * 1000;
    lastSecsShown = ROUND_SECONDS;
    hud.timeValue.set(String(ROUND_SECONDS));
    setWaveStatus('GET READY...');
    menu.finalGroup.visible = false;
    layoutMenu();
    running = true;
    lastTime = performance.now();
    syncOverlays();
    startMusic();
    beginCameraStart();
  }

  function pauseGame() {
    if (!running) return;
    running = false;
    paused = true;
    stopMusic();
    resetHandState();
    stopCamera();
    pause.scoreValue.set(String(score));
    syncOverlays();
  }

  function resumeGame() {
    paused = false;
    running = true;
    lastTime = performance.now();
    syncOverlays();
    startMusic();
    beginCameraStart();
  }

  function finishGame() {
    running = false;
    paused = false;
    stopMusic();
    resetHandState();
    stopCamera();
    menu.finalValue.set(String(score));
    menu.finalGroup.visible = true;
    layoutMenu();
    syncOverlays();
  }

  // ---- startup: run last, after every let/const above has been declared ----
  resize();
  initThree();
  setTimeout(resize, 50);
  setTimeout(resize, 300);
  setTimeout(warmUpHands, 500);
  requestAnimationFrame(frame);
})();
</script>
</body>
